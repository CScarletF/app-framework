<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>App Framework</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Saira:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Nav is built entirely at runtime by app.js from whichever
         modules' module.json files modules.json lists -- nothing about
         which modules exist is hardcoded here. #user-area (bottom of the
         sidebar) is filled by app.js only when the backend has auth. -->
    <aside id="sidebar">
        <nav id="nav"></nav>
        <div id="user-area"></div>
    </aside>
    <main id="content"></main>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
