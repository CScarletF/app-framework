# Coolify variant of docker-compose.yml. The Compose file next to it is unchanged
# and stays the source for `python setup.py` on a plain Docker host.
#
# Code is baked into images, not bind-mounted: Coolify resolves relative bind
# mounts against its own config directory on the target (/data/coolify/applications/<uuid>),
# where the repository files are not available.
#
#   app    built from core/k8s/Dockerfile.app (the Kubernetes backend image, unchanged)
#   nginx  built from core/docker/Dockerfile.coolify-web (frontend + server block proxying to app)
#
# Differences from docker-compose.yml:
#   - no env_file: Coolify injects variables, mapped explicitly below
#   - nginx publishes APP_HOST_PORT (default 8082) on the host. With a Coolify proxy
#     (Traefik) the port is not needed and can be ignored
#   - modules/<name>/table_core.py must be committed: it is baked into the image
#
# Configure in Coolify: build pack Docker Compose, base directory /core/docker,
# compose location /docker-compose.coolify.yml. With a proxy, set a domain on the
# nginx service (http://host:8080).

services:
  app:
    build:
      context: ../..
      dockerfile: core/k8s/Dockerfile.app
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST:?DB_HOST is required}
      - DB_PORT=${DB_PORT:-5000}
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - SESSION_LIFETIME_MINUTES=${SESSION_LIFETIME_MINUTES:-480}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_LOCKOUT_MINUTES=${LOGIN_LOCKOUT_MINUTES:-15}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-8}
      - GUNICORN_CMD_ARGS=--workers ${GUNICORN_WORKERS:-2}

  nginx:
    build:
      context: ../..
      dockerfile: core/docker/Dockerfile.coolify-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_HOST_PORT:-8082}:8080"
    expose:
      - "8080"
