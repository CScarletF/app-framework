# Coolify variant of docker-compose.yml. The Compose file next to it is unchanged
# and stays the source for `python setup.py` on a plain Docker host.
#
# Differences from docker-compose.yml:
#   - no env_file: Coolify injects variables, mapped explicitly below
#   - no published ports: Coolify's proxy routes to nginx on container port 80
#   - no custom network: Coolify manages networking
#
# Configure in Coolify: build pack Docker Compose, base directory /core/docker,
# compose location /docker-compose.coolify.yml, domain on the nginx service.
# Relative bind mounts (../..) assume Coolify checks the repo out on the target host.

services:
  app:
    build:
      context: ../..
      dockerfile: core/docker/python/Dockerfile
    restart: unless-stopped
    volumes:
      # Whole project root: app.py discovers modules/ at runtime
      - ../..:/app
    working_dir: /app
    environment:
      - DB_HOST=${DB_HOST:?DB_HOST is required}
      - DB_PORT=${DB_PORT:-5000}
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - SESSION_LIFETIME_MINUTES=${SESSION_LIFETIME_MINUTES:-480}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_LOCKOUT_MINUTES=${LOGIN_LOCKOUT_MINUTES:-15}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-8}
    command: gunicorn --chdir core/backend -w 2 -b 0.0.0.0:8000 app:app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../../core/frontend:/var/www/frontend:ro
      - ../../modules:/var/www/frontend/modules:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    expose:
      - "80"
