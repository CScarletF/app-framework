server {
    listen 80;
    server_name localhost;
    root /var/www/frontend;
    index index.html;

    # /api/* is dynamic -- proxied straight to the Flask/gunicorn
    # container. Everything else is static frontend content, served by
    # nginx directly (no PHP-style single-entry-point routing needed
    # here, since there's no server-rendered page logic anymore).
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA-style fallback: any unmatched path falls through to index.html
    # so client-side nav (app.js building views from module.json) works
    # on a hard refresh too.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
