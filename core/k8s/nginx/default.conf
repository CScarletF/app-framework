# Kubernetes variant of core/docker/nginx/default.conf.
# nginx and gunicorn share one pod, so the API is on localhost, not on a
# Compose service name. Listens on 8080 (non-root image).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend source must never be served, even if it ended up in the web root.
    location ~* \.(py|sql|conf)$ {
        return 404;
    }

    # SPA-style fallback so client-side navigation survives a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
