# NOTE: the label differs on purpose. The Service and Deployment select
# app.kubernetes.io/name=app-framework; a Job pod carrying that label would
# receive web traffic (no readiness probe) while it runs.
#
# One-shot admin seeding, same logic as setup.py's seed step: creates the
# .env admin only if no admin exists. Idempotent; deploy_k8s.py deletes the
# previous Job before re-applying (Job specs are immutable).
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-admin
  labels:
    app.kubernetes.io/name: app-framework-seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-framework-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: seed
          image: app-framework-app
          command: ["python", "core/backend/seed_admin.py"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
