server {
    listen 80;
    server_name localhost;
    root /var/www/backend/public;
    index index.php;

    # Any request that doesn't match a real file falls through to
    # index.php — this is what lets bramus/router see the full URL
    # and decide what to do with it, rather than nginx trying (and
    # failing) to find a literal file matching the request path.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Anything ending in .php gets handed off to the php-fpm container
    # over the FastCGI protocol — nginx itself doesn't execute PHP,
    # it just serves static files and proxies PHP requests elsewhere.
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}