services:
  php:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    volumes:
      # Bind mount: the php container sees the real backend/ folder on
      # jenkins's disk directly — same files nginx sees below, so
      # nginx's SCRIPT_FILENAME path always matches what actually
      # exists inside the php container.
      - ../backend:/var/www/backend
    env_file:
      - ../.env
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../backend/public:/var/www/backend/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app_net

networks:
  app_net: